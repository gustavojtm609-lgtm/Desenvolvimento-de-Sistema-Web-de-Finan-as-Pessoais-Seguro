services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expenses_control}
      MYSQL_USER: ${MYSQL_USER:-expenses}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Execute npm run setup antes de iniciar}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Execute npm run setup antes de iniciar}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e ''SELECT 1'' >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped
  app:
    build: .
    environment:
      NODE_ENV: production
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      PORT: 3000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      DEV_ORIGIN: ${DEV_ORIGIN:-http://localhost:5173}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-expenses_control}
      MYSQL_USER: ${MYSQL_USER:-expenses}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Execute npm run setup antes de iniciar}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_HOURS: ${SESSION_HOURS:-8}
      SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
volumes:
  mysql_data:
